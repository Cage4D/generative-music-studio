<style>
:root{--bg:#06080d;--panel:rgba(13,19,34,.66);--line:rgba(160,185,235,.14);--fg:#e6ebf5;--mut:#8792a8;--acc:#6f9bff;--acc2:#a9c0ff;--glow:rgba(90,130,255,.22);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(900px 500px at 70% -10%,rgba(60,100,230,.22),transparent 70%),radial-gradient(700px 400px at 0% 100%,rgba(40,70,170,.2),transparent 70%)}

.waves svg:nth-child(2){position:absolute;inset:0;animation-duration:70s;animation-direction:reverse;opacity:.6}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.tab{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;font:inherit}
.tab.on{color:var(--fg);border-color:var(--acc);background:rgba(111,155,255,.1)}
h1{font:300 clamp(34px,5.6vw,54px)/1.1 Manrope,Inter,system-ui,sans-serif;letter-spacing:-.02em;margin:0}

.in{position:relative;height:100%}

.c{border-radius:4px;background:rgba(160,185,235,.07)}.c.b{background:rgba(160,185,235,.13)}

.tx i{flex:1;height:var(--h);border-radius:3px;background:linear-gradient(var(--acc2),var(--acc));opacity:.7}

.tp{display:flex;align-items:center;gap:16px;padding:16px 18px;flex-wrap:wrap}

.sd label{color:var(--mut);font-size:12px}
input[type=number],input[type=text],select{background:rgba(6,8,13,.6);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;min-width:0}
#seed{width:136px;font-variant-numeric:tabular-nums}
.btn{background:rgba(111,155,255,.1);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}

.note{color:var(--mut);font-size:12px;padding:0 4px;margin-top:10px}

summary{cursor:pointer;color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase}

.r label{color:var(--mut)}.r select{grid-column:2/4}.r output{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}

input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--fg);box-shadow:0 0 10px var(--acc)}
.save{padding:16px 18px;margin-top:16px}
.save label{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-bottom:6px}
#title{width:100%;margin-bottom:12px}
#remix{font-size:12px;color:var(--acc2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:inline-block;margin-bottom:12px}
#out{margin-top:12px;font-size:13px;word-break:break-all}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:8px;animation:pl 1s ease-in-out infinite alternate}
@keyframes pl{to{opacity:.2}}
#out a{color:var(--acc2)}
pre{margin:10px 0 0;font-size:11px;color:var(--mut);overflow-x:auto;max-height:220px}

<header><a class='logo'><svg class='mk' viewBox='0 0 24 24' width='22' height='22' aria-hidden='true'><g fill='none' stroke='#8fb0ff' stroke-width='2' stroke-linecap='round'><path d='M4 10v4'/><path d='M8 6v12'/><path d='M12 3v18'/><path d='M16 7v10'/><path d='M20 10v4'/></g></svg><span>Generative <em>Music</em> Studio</span></a><nav><a class='on'>Studio</a><a>Gallery</a><span class='tag'>Preview</span></nav></header>

    <details style="padding:12px 0 0;border:0"><summary>Request preview</summary><pre id="json"></pre></details>
  </div>
</aside>

"melody":{n:"Melody",b:"melody",rows:8,f:[S("waveform","Waveform",WF,"triangle"),S("contour","Contour",["ascending","descending","arch","wave","random"],"arch"),N("octaveRange","Octave range",1,3,1,2),S("noteLength","Note length",NL,"8n"),N("restProbability","Rests",0,1,.05,.2),N("leapiness","Leapiness",0,1,.05,.3),N("phraseLengthBars","Phrase bars",1,8,1,4)]}
};
const DS={'arpeggio':'Broken chords that step through the scale, one note at a time.','ambient-pad':'Slow, wide chords that swell and dissolve into the background.','drum-pattern':'Kick, snare and hats laid out on a step grid.','bassline':'A low, steady voice that anchors the harmony.','texture':'Filtered noise that drifts and shimmers underneath.','melody':'A single line that rises, falls and breathes.'};function hero(){const k=Object.keys(G);$('#gname').textContent=G[st.gen].n;$('#eye').textContent='Generator '+String(k.indexOf(st.gen)+1).padStart(2,'0')+' / '+String(k.length).padStart(2,'0');$('#lede').textContent=DS[st.gen];$('#sum').innerHTML=[st.root+' '+st.scale,st.tempo+' bpm','seed '+st.seed].map(t=>`<span class='chip'>${t}</span>`).join('')}const st={gen:"arpeggio",seed:1839204412,tempo:96,root:"D",scale:"dorian",density:.6,swing:.1,fx:{reverb:.35,delay:.2},bl:{}};
for(const g in G){st.bl[g]={};G[g].f.forEach(x=>st.bl[g][x.k]=x.d)}

function row(l,c){const r=mk("div","r","<label>"+l+"</label>");r.append(...c);return r}
function slider(l,min,max,step,get,set){
  const i=mk("input");i.type="range";i.min=min;i.max=max;i.step=step;i.value=get();i.setAttribute("aria-label",l);const o=mk("output");
  const sync=()=>{o.textContent=+i.value;i.style.setProperty("--p",(i.value-min)/(max-min)*100+"%")};
  i.oninput=()=>{set(+i.value);sync();upd()};sync();return row(l,[i,o])}
function select(l,opts,get,set){
  const s=mk("select","",opts.map(o=>`<option ${o==get()?"selected":""}>${o}</option>`).join(""));s.setAttribute("aria-label",l);
  s.onchange=()=>{set(typeof opts[0]==="number"?+s.value:s.value);upd()};return row(l,[s])}
function tabs(){const T=$("#tabs");T.innerHTML="";for(const g in G){const b=mk("button","tab"+(g===st.gen?" on":""),G[g].n);b.onclick=()=>{st.gen=g;tabs();params();upd()};T.append(b)}}
function params(){
  const P=$("#params");P.innerHTML="";const g=G[st.gen],b=st.bl[st.gen];
  const sec=(t,rows,open=true)=>{const d=mk("details","","<summary>"+t+"</summary>");d.open=open;rows.forEach(r=>d.append(r));P.append(d)};
  sec("Sound",[slider("Tempo",40,220,1,()=>st.tempo,v=>st.tempo=v),select("Root",NOTES,()=>st.root,v=>st.root=v),select("Scale",SC,()=>st.scale,v=>st.scale=v),slider("Density",0,1,.05,()=>st.density,v=>st.density=v),slider("Swing",0,1,.05,()=>st.swing,v=>st.swing=v)]);
  sec(g.n,g.f.map(x=>x.o?select(x.l,x.o,()=>b[x.k],v=>b[x.k]=v):slider(x.l,x.min,x.max,x.step,()=>b[x.k],v=>b[x.k]=v)));
  sec("Effects",FX.map(k=>slider(k[0].toUpperCase()+k.slice(1),0,1,.05,()=>st.fx[k]||0,v=>{v?st.fx[k]=v:delete st.fx[k]})),false);
}
function vis(){
  const g=st.gen,b=st.bl[g],r=m32(st.seed);let h,d;
  if(g==="ambient-pad"){
    const L=b.chordLengthBars,n=Math.ceil(8/L);d=1920/st.tempo;
    const blk=()=>{let s="";for(let i=0;i<b.chordSize;i++){const w=40+r()*60;s+=`<i style="width:${w}%;margin-left:${r()*(100-w)}%"></i>`}return `<div class="blk" style="flex:${L}">${s}</div>`};
    h='<div class="pad">'+Array.from({length:n},blk).join("")+"</div>";
  }else if(g==="texture"){
    const sp=Math.min(6,Math.max(.6,2/b.movementRate));d=1;
    h='<div class="tx">'+Array.from({length:44},()=>`<i style="--h:${15+(25+r()*60)*(.35+b.movementDepth*.65)}%;--s:${sp}s;--dl:-${(r()*3).toFixed(2)}s"></i>`).join("")+"</div>";
  }else{
    const cols=g==="drum-pattern"?b.steps:16,R=G[g].rows,cells=[];
    if(g==="drum-pattern"){const p=[.3,.22,b.hatDensity,.18];for(let i=0;i<R;i++)for(let c=0;c<cols;c++){let o=r()<p[i]*(.5+st.density);if(b.style==="four-on-floor"&&i===0)o=c%4===0;cells.push(o)}}
    else{const pk=Array.from({length:cols},()=>[Math.floor(r()*R),r()<st.density]);for(let i=0;i<R;i++)for(let c=0;c<cols;c++)cells.push(pk[c][1]&&pk[c][0]===i)}
    d=cols*15/st.tempo;
    h=`<div class="g" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${R},1fr)">`+cells.map((o,k)=>`<i class="c${o?" on":""}${(k%cols)%4?"":" b"}"></i>`).join("")+"</div>";
  }
  $('#vis').innerHTML=`<div class='vh'><span>Pattern preview</span><span class='lv'><i></i></span></div><div class='in'>${h}<div class="head" style="--d:${d}s"></div></div>`;
}
function upd(){
  vis();hero();const _s=`${st.root} ${st.scale} · ${st.tempo} bpm · seed ${st.seed}`;
  const q={seed:st.seed,tempo:st.tempo,root:st.root,scale:st.scale,density:st.density,swing:st.swing,effects:st.fx,[G[st.gen].b]:st.bl[st.gen]};
  $("#json").textContent=JSON.stringify({title:$("#title").value||undefined,parentSlug:remix||undefined,pattern:{generatorId:st.gen,params:q}},null,1);
}
const remix=location.hash.startsWith("#remix=")?location.hash.slice(7):"";
if(remix){$("#remix").hidden=false;$("#remix b").textContent=remix;$("#save").textContent="Save remix"}

const seed=$("#seed");seed.value=st.seed;
seed.oninput=()=>{st.seed=Math.min(4294967295,Math.max(0,Math.floor(+seed.value||0)));upd()};
$("#shuf").onclick=()=>{st.seed=Math.floor(Math.random()*4294967296);seed.value=st.seed;upd()};
const cp=async t=>{try{await navigator.clipboard.writeText(t)}catch(e){}};
$("#cps").onclick=()=>cp(st.seed);
$("#play").onclick=e=>{const on=document.body.classList.toggle("playing");e.currentTarget.innerHTML=on?"&#10074;&#10074;":"&#9654;";e.currentTarget.setAttribute("aria-pressed",on);e.currentTarget.setAttribute("aria-label",on?"Stop":"Play")};
$("#title").oninput=e=>{$("#cnt").textContent=e.target.value.length+"/60";upd()};
$("#save").onclick=()=>{
  const o=$("#out");o.innerHTML='<span class="dot"></span>Waking the server…';
  setTimeout(()=>{const A="abcdefghijkmnpqrstuvwxyz23456789";let s="";for(let i=0;i<10;i++)s+=A[Math.floor(Math.random()*A.length)];
    const u="https://your-site.app/track/"+s;o.innerHTML=`Saved. <a>${u}</a> <button class="btn" id="cl" style="margin-left:6px">Copy link</button>`;$("#cl").onclick=()=>cp(u)},1100);
};
function wave(a,c,ph){let d="M0 200";for(let x=0;x<=2880;x+=20)d+=` L${x} ${(200+a*Math.sin(x/1440*c*2*Math.PI+ph)*Math.sin(x/1440*2*Math.PI+ph)).toFixed(1)}`;return d}
const sv=(ps)=>`<svg viewBox="0 0 2880 400" preserveAspectRatio="none" fill="none">${ps}</svg>`,pa=(d,o,w)=>`<path d="${d}" stroke="#6f9bff" stroke-opacity="${o}" stroke-width="${w}" vector-effect="non-scaling-stroke"/>`;
const rib=(n,a,c,ph,o)=>Array.from({length:n},(_,i)=>pa(wave(a*(.5+i/n),c,ph+i*.16),(o*(.35+.65*i/n)).toFixed(2),1)).join('');$('#waves').innerHTML=sv(rib(16,60,3,0,.5))+sv(rib(10,42,2,2,.28));
tabs();params();upd();
</script>
</body>
</html>
